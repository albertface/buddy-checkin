name: buddy-checkin

on:
  schedule:
    # UTC 17:03 = 北京时间 01:03（避开整点高峰，实际开跑更贴近凌晨1点）
    - cron: "13 17 * * *"
    # UTC 05:03 = 北京时间 13:03
    - cron: "31 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install playwright + chromium
        run: |
          pip install "playwright==1.58.0"
          playwright install --with-deps chromium

      - name: Restore login state
        env:
          WB_STATE_JSON: ${{ secrets.WB_STATE_JSON }}
        run: printf '%s' "$WB_STATE_JSON" > state.json

      - name: Run daily checkin
        run: python checkin.py
